  - id: x-4
    bucket: cross
    question: Why are users being logged out, and when will the fix PR be ready?
    answer: Two tabs refreshing the token at once invalidate each other (a race condition); Omar will open the fix PR by Tuesday.
    gold:
      - { file: github-issue-142.md, quote: "a race condition in token refresh" }
      - { file: team-sync-2026-09-14.transcript.txt, quote: "I will open a pull request with the fix by Tuesday" }

