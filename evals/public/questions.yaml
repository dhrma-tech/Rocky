  # --- Notion / GitHub decisions and owners ---
  - id: ng-1
    bucket: notion_github
    question: Who owns the data migration in Project Atlas?
    answer: Lena.
    gold: [{ file: notion-project-atlas.md, quote: "Lena owns the data migration from the legacy reporting service" }]
  - id: ng-2
    bucket: notion_github
    question: Which database did we choose for Project Atlas, and why?
    answer: PostgreSQL over MongoDB, because reporting needs relational joins across accounts, invoices and usage events.
    gold: [{ file: notion-project-atlas.md, quote: "We chose PostgreSQL over MongoDB because our reporting needs relational joins" }]
  - id: ng-3
    bucket: notion_github
    question: What is the rollout plan for the new reporting backend?
    answer: 10 percent of accounts first, then 50 percent after one week without errors, then 100 percent.
    gold: [{ file: notion-project-atlas.md, quote: "rolls out to 10 percent of accounts first" }]
  - id: ng-4
    bucket: notion_github
    question: What is the root cause of issue 142?
    answer: A race condition in token refresh when two tabs refresh at the same moment.
    gold: [{ file: github-issue-142.md, quote: "Root cause found: a race condition in token refresh" }]
  - id: ng-5
    bucket: notion_github
    question: How does the fix plan for issue 142 prevent the problem?
    answer: Serialize refreshes with a cross-tab lock using BroadcastChannel and retry once with the newest token on a 401.
    gold: [{ file: github-issue-142.md, quote: "serialize refreshes with a cross-tab lock using the BroadcastChannel API" }]

