# Public eval set (PLAN §6). Gold quotes must appear verbatim (whitespace-normalized) in the named corpus file.
# answerable: false means the system must answer "Not found in your sources".
questions:
  # --- Lecture PDF facts (page anchors) ---
  - id: pdf-1
    bucket: pdf
    question: What does the law of demand state?
    answer: Other things being equal, a higher price leads to a lower quantity demanded and a lower price to a higher quantity demanded.
    gold: [{ file: econ-lecture-notes.pdf, quote: "a higher price leads to a lower quantity demanded" }]
  - id: pdf-2
    bucket: pdf
    question: What is the equilibrium price and quantity in the gasoline example?
    answer: $1.40 per gallon, with 600 million gallons demanded and supplied.
    gold: [{ file: econ-lecture-notes.pdf, quote: "the market reaches equilibrium at a price of $1.40 per gallon" }]
  - id: pdf-3
    bucket: pdf
    question: What is a price ceiling, and what is a common example?
    answer: A legal maximum price; rent control is a common example.
    gold: [{ file: econ-lecture-notes.pdf, quote: "A price ceiling is a legal maximum on the price at which a good can be sold" }]
  - id: pdf-4
    bucket: pdf
    question: What happens when a price floor is set above the equilibrium price?
    answer: It creates a surplus because quantity supplied exceeds quantity demanded.
    gold: [{ file: econ-lecture-notes.pdf, quote: "When a price floor is set above the equilibrium price, it creates a surplus" }]
  - id: pdf-5
    bucket: pdf
    question: What is the difference between a normal good and an inferior good?
    answer: Demand for a normal good rises with income; demand for an inferior good falls when income rises.
    gold: [{ file: econ-lecture-notes.pdf, quote: "An inferior good is one for which demand falls when income rises" }]
  - id: pdf-6
    bucket: pdf
    question: What does ceteris paribus mean in the lecture notes?
    answer: Latin for other things being equal; all other factors are held constant while price varies.
    gold: [{ file: econ-lecture-notes.pdf, quote: "ceteris paribus, Latin for other things being equal" }]
  - id: pdf-7
    bucket: pdf
    question: Which factors shift the supply curve?
    answer: Production costs, technology, natural conditions like weather, and government policies such as taxes, subsidies and regulations.
    gold: [{ file: econ-lecture-notes.pdf, quote: "The main factors that shift supply are the costs of production" }]
  - id: pdf-8
    bucket: pdf
    question: What example of complements do the notes give?
    answer: Golf clubs and golf balls.
    gold: [{ file: econ-lecture-notes.pdf, quote: "such as golf clubs and golf balls" }]

