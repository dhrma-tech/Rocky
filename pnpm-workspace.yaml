packages:
  - apps/*
  - packages/*
  - examples/*
# better-sqlite3 13 (and the multiple-ciphers fork) bundle N-API prebuilds; their build scripts would force a source compile.
onlyBuiltDependencies:
  - "@biomejs/biome"
  # Downloads the Electron binary (apps/desktop). CI test jobs skip it with ELECTRON_SKIP_BINARY_DOWNLOAD.
  - electron
ignoredBuiltDependencies:
  - better-sqlite3
  - better-sqlite3-multiple-ciphers
